#cloud-config
datasource:
  Ec2:
    strict_id: false
ssh_pwauth: no
users:
  - name: alice
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKXgOq/gqulOJkFQVF+N1oQZEOEJmVkxfwa3Qwz9ioog sergeisokolov@fedora
  - name: bob
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 <SECOND_PUBLIC_KEY> bob@itmo
write_files:
  - path: /usr/local/etc/startup.sh
    permissions: '755'
    content: |
      #!/bin/bash
      apt-get update
      apt-get install -y nginx
      service nginx start
      sed -i -- "s/ nginx/ Yandex Cloud - itmo-2/" /var/www/html/index.nginx-debian.html
    defer: true
runcmd:
  - ['/usr/local/etc/startup.sh']