folder_id: b1ga57bidvpjbr7mbhot
name: ig-fixed-3
description: Fixed-size group of 3 VMs with auto-healing
service_account_id: ajev1uch48hpm0djr3s3

allocation_policy:
  zones:
    - zone_id: ru-central1-a
    - zone_id: ru-central1-d
    - zone_id: ru-central1-e

scale_policy:
  fixed_scale:
    size: 3

deploy_policy:
  max_unavailable: 1
  max_expansion: 0
  startup_duration: 60s
  strategy: PROACTIVE
  minimal_action: RESTART

auto_healing_policy:
  auto_healing_action: RECREATE

health_checks_spec:
  health_check_specs:
    - interval: 10s
      timeout: 5s
      healthy_threshold: 2
      unhealthy_threshold: 3
      tcp_options:
        port: 22
  max_checking_health_duration: 60s

instance_template:
  platform_id: standard-v3
  resources_spec:
    cores: 2
    memory: 2147483648
    core_fraction: 100
  boot_disk_spec:
    mode: READ_WRITE
    disk_spec:
      type_id: network-ssd
      size: 8589934592
      image_id: fd85u7s36ukaumqt743m
  network_interface_specs:
    - subnet_ids:
        - e9b2j63tq55iak0gvupi   # ig-subnet-a, ru-central1-a
        - fl8339d3u81fdpqmoum2   # ig-subnet-d, ru-central1-d
        - ajcraff75uerjksa87ff   # ig-subnet-e, ru-central1-e
      primary_v4_address_spec: {}
